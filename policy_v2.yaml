version: 1
monitoring:
- path: ~/.azure
  type: directory
  recursive: true
  category: cloud_credentials

- path: ~/.aws
  type: directory
  recursive: true
  category: cloud_credentials

- path: ~/.ssh
  type: directory
  recursive: true
  category: authentication

- path: ~/.kube
  type: directory
  recursive: true
  category: cloud_credentials

- path: ~/.steampipe
  type: directory
  recursive: true
  category: database_credentials

# Optional alert sinks (see alerts.py). Both default to off so a fresh clone
# never reaches out to the network. Environment overrides:
#   TDT_SYSLOG_ENABLED=1   TDT_WEBHOOK_URL=https://example.internal/hooks/tdt
alerting:
  syslog:
    enabled: false
    facility: LOCAL0
  webhook:
    enabled: false
    url: ""
    timeout: 5
